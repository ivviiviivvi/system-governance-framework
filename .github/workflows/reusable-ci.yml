name: 'Reusable CI Workflow'

on:
  workflow_call:
    inputs:
      config-path:
        description: 'Path to governance.yml configuration file'
        required: false
        type: string
        default: '.github/governance.yml'
      languages:
        description: 'Override language detection (JSON array or "auto")'
        required: false
        type: string
        default: 'auto'
      coverage-enabled:
        description: 'Coverage override: auto inherits config; quote true or false'
        required: false
        type: string
        default: 'auto'
    secrets:
      codecov-token:
        description: 'Codecov token for coverage upload'
        required: false

permissions:
  contents: read

jobs:
  setup:
    name: Configuration & Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      config: ${{ steps.load-config.outputs.config }}
      languages: ${{ steps.detect-languages.outputs.languages }}
      has-python: ${{ steps.detect-languages.outputs.has-python }}
      has-javascript: ${{ steps.detect-languages.outputs.has-javascript }}
      has-go: ${{ steps.detect-languages.outputs.has-go }}
      has-java: ${{ steps.detect-languages.outputs.has-java }}
      ci-enabled: ${{ steps.check-features.outputs.ci-enabled }}
      coverage-enabled: ${{ steps.check-features.outputs.coverage-enabled }}
      pre-commit-enabled: ${{ steps.check-features.outputs.pre-commit-enabled }}
      defining-workflow-sha: ${{ steps.workflow-identity.outputs.sha }}
      defining-workflow-repository: ${{ steps.workflow-identity.outputs.repository }}

    steps:
      - name: Validate defining workflow identity
        id: workflow-identity
        env:
          GOVERNANCE_CALLER_REPOSITORY: ${{ github.repository }}
          GOVERNANCE_CALLER_REPOSITORY_ID: ${{ github.repository_id }}
          GOVERNANCE_CALLER_SHA: ${{ github.sha }}
          GOVERNANCE_CALLER_EVENT: ${{ github.event_name }}
          GOVERNANCE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GOVERNANCE_RUN_ID: ${{ github.run_id }}
          GOVERNANCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          GOVERNANCE_READ_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PYTHON'
          import json
          import os
          import re
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("redirected identity response")

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate metadata key")
                  result[key] = value
              return result

          try:
              repository = os.environ["GOVERNANCE_CALLER_REPOSITORY"]
              run_id = os.environ["GOVERNANCE_RUN_ID"]
              attempt = os.environ["GOVERNANCE_RUN_ATTEMPT"]
              event = os.environ["GOVERNANCE_CALLER_EVENT"]
              expected_head = (os.environ["GOVERNANCE_PR_HEAD_SHA"]
                               if event in ("pull_request", "pull_request_target")
                               else os.environ["GOVERNANCE_CALLER_SHA"])
              if not re.fullmatch(r"[0-9a-f]{40}", expected_head):
                  raise ValueError("invalid event head")
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
                  raise ValueError("invalid caller repository")
              if not all(re.fullmatch(r"[1-9][0-9]*", item) for item in (run_id, attempt)):
                  raise ValueError("invalid run identity")
              url = f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/attempts/{attempt}"
              request = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GOVERNANCE_READ_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.build_opener(NoRedirect).open(request, timeout=15) as response:
                  raw = response.read(1024 * 1024 + 1)
              if len(raw) > 1024 * 1024:
                  raise ValueError("oversized run metadata")
              run = json.loads(raw, object_pairs_hook=unique_object)
              if (type(run["id"]) is not int or run["id"] != int(run_id)
                      or type(run["run_attempt"]) is not int or run["run_attempt"] != int(attempt)
                      or run["repository"]["full_name"] != repository
                      or str(run["repository"]["id"]) != os.environ["GOVERNANCE_CALLER_REPOSITORY_ID"]
                      or run["event"] != event or run["head_sha"] != expected_head):
                  raise ValueError("run identity mismatch")
              trusted_repository = "organvm-iv-taxis/system-governance-framework"
              prefix = trusted_repository + "/.github/workflows/reusable-ci.yml@"
              references = run["referenced_workflows"]
              if not isinstance(references, list):
                  raise ValueError("missing workflow references")
              matches = [item for item in references
                         if isinstance(item, dict) and isinstance(item.get("path"), str)
                         and item["path"].startswith(prefix) and item["path"] != prefix]
              if len(matches) != 1 or not re.fullmatch(r"[0-9a-f]{40}", matches[0].get("sha", "")):
                  raise ValueError("missing or ambiguous defining revision")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"repository={trusted_repository}\nsha={matches[0]['sha']}\n")
          except Exception:
              raise SystemExit("Defining workflow metadata unavailable or invalid; refusing caller code.")
          PYTHON

      - name: Checkout defining governance revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.workflow-identity.outputs.repository }}
          ref: ${{ steps.workflow-identity.outputs.sha }}
          persist-credentials: false

      - name: Checkout caller source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: caller-source
          persist-credentials: false

      - name: Set up trusted parser Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install pinned parser dependencies in an isolated environment
        run: |
          python -m venv .governance-venv
          .governance-venv/bin/python -m pip install --disable-pip-version-check 'PyYAML==6.0.3' 'jsonschema==4.26.0'
          echo "$GITHUB_WORKSPACE/.governance-venv/bin" >> "$GITHUB_PATH"

      - name: Load governance configuration
        id: load-config
        uses: ./.github/actions/load-config
        with:
          source-root: caller-source
          config-path: ${{ inputs.config-path }}

      - name: Detect project languages
        id: detect-languages
        uses: ./.github/actions/detect-languages
        with:
          source-root: caller-source
          override: ${{ inputs.languages }}

      - name: Check feature flags
        id: check-features
        env:
          GOVERNANCE_CONFIG_JSON: ${{ steps.load-config.outputs.config }}
          GOVERNANCE_COVERAGE: ${{ inputs.coverage-enabled }}
        run: python -I "$GITHUB_WORKSPACE/src/workflow_inputs.py" features

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.pre-commit-enabled == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    needs: setup
    if: |
      fromJSON(needs.setup.outputs.config).features.ci.enabled != false &&
      needs.setup.outputs.has-python == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi
          if [ -f pyproject.toml ]; then
            pip install -e '.[dev]'
          fi

      - name: Run tests
        run: |
          if command -v pytest &> /dev/null; then
            if [ "${{ needs.setup.outputs.coverage-enabled }}" = "true" ]; then
              pytest --cov --cov-report=xml --cov-report=term
            else
              pytest
            fi
          else
            echo "::error::Python was detected but pytest is unavailable; no tests were executed."
            exit 1
          fi

      - name: Check coverage credential availability
        id: coverage-token
        if: needs.setup.outputs.coverage-enabled == 'true'
        env:
          CODECOV_TOKEN: ${{ secrets.codecov-token }}
        run: |
          if [[ -n "$CODECOV_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage
        if: needs.setup.outputs.coverage-enabled == 'true' && steps.coverage-token.outputs.available == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.codecov-token }}
          file: ./coverage.xml
          flags: python
          fail_ci_if_error: false

  test-javascript:
    name: Test JavaScript/TypeScript
    runs-on: ubuntu-latest
    needs: setup
    if: |
      fromJSON(needs.setup.outputs.config).features.ci.enabled != false &&
      needs.setup.outputs.has-javascript == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: |
          if node -e 'const p = require("./package.json"); process.exit(typeof p.scripts?.test === "string" && p.scripts.test.trim() ? 0 : 1)'; then
            if [ "${{ needs.setup.outputs.coverage-enabled }}" = "true" ]; then
              npm run test -- --coverage
            else
              npm test
            fi
          else
            echo "::error::JavaScript was detected but no test script exists; no tests were executed."
            exit 1
          fi

      - name: Check coverage credential availability
        id: coverage-token
        if: needs.setup.outputs.coverage-enabled == 'true'
        env:
          CODECOV_TOKEN: ${{ secrets.codecov-token }}
        run: |
          if [[ -n "$CODECOV_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage
        if: needs.setup.outputs.coverage-enabled == 'true' && steps.coverage-token.outputs.available == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.codecov-token }}
          flags: javascript
          fail_ci_if_error: false

  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    needs: setup
    if: |
      fromJSON(needs.setup.outputs.config).features.ci.enabled != false &&
      needs.setup.outputs.has-go == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.21'
          cache: true

      - name: Run tests
        run: |
          if [ "${{ needs.setup.outputs.coverage-enabled }}" = "true" ]; then
            go test -v -coverprofile=coverage.out ./...
          else
            go test -v ./...
          fi

      - name: Check coverage credential availability
        id: coverage-token
        if: needs.setup.outputs.coverage-enabled == 'true'
        env:
          CODECOV_TOKEN: ${{ secrets.codecov-token }}
        run: |
          if [[ -n "$CODECOV_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage
        if: needs.setup.outputs.coverage-enabled == 'true' && steps.coverage-token.outputs.available == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.codecov-token }}
          file: ./coverage.out
          flags: go
          fail_ci_if_error: false

  test-java:
    name: Test Java
    runs-on: ubuntu-latest
    needs: setup
    if: |
      fromJSON(needs.setup.outputs.config).features.ci.enabled != false &&
      needs.setup.outputs.has-java == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests (Maven)
        if: hashFiles('**/pom.xml') != ''
        run: mvn test

      - name: Run tests (Gradle)
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew test

      - name: Reject missing Java test configuration
        if: hashFiles('**/pom.xml') == '' && hashFiles('**/build.gradle*') == ''
        run: |
          echo "::error::Java was detected but neither Maven nor Gradle test configuration exists."
          exit 1

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [setup, pre-commit, test-python, test-javascript, test-go, test-java]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# 🎯 CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Preset:** ${{ fromJSON(needs.setup.outputs.config).framework.preset }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ fromJSON(needs.setup.outputs.config).framework.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Detected Languages" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.setup.outputs.languages }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY

          # Check job results
          if [ "${{ needs.pre-commit.result }}" = "success" ]; then
            echo "- ✅ Pre-commit checks passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.pre-commit.result }}" = "failure" ]; then
            echo "- ❌ Pre-commit checks failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-python.result }}" = "success" ]; then
            echo "- ✅ Python tests passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test-python.result }}" = "failure" ]; then
            echo "- ❌ Python tests failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-javascript.result }}" = "success" ]; then
            echo "- ✅ JavaScript tests passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test-javascript.result }}" = "failure" ]; then
            echo "- ❌ JavaScript tests failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-go.result }}" = "success" ]; then
            echo "- ✅ Go tests passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test-go.result }}" = "failure" ]; then
            echo "- ❌ Go tests failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-java.result }}" = "success" ]; then
            echo "- ✅ Java tests passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test-java.result }}" = "failure" ]; then
            echo "- ❌ Java tests failed" >> $GITHUB_STEP_SUMMARY
          fi
